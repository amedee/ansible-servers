---
- name: Install Redis
  ansible.builtin.apt:
    name:
      - redis-server
    state: present
    update_cache: true
    cache_valid_time: 86400 # One day
    lock_timeout: 300 # 5 minutes

- name: Configure Redis
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    create: true
    owner: root
    group: root
    mode: "0644"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop: "{{ redis_settings }}"
  notify: Restart redis
