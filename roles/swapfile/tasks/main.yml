---
- name: Create swapfile
  ansible.builtin.command:
    argv:
      - fallocate
      - -l
      - "{{ swapfile_size }}M"
      - "{{ swapfile_path }}"
    creates: "{{ swapfile_path }}"
  register: swapfile_allocation

- name: Set swapfile permissions
  ansible.builtin.file:
    path: "{{ swapfile_path }}"
    owner: root
    group: root
    mode: "0600"
    state: file

- name: Initialize swapfile
  ansible.builtin.command:
    argv:
      - mkswap
      - "{{ swapfile_path }}"
  when:
    - swapfile_allocation is changed
    - not ansible_check_mode
  changed_when: true

- name: Add swapfile to /etc/fstab
  ansible.posix.mount:
    src: "{{ swapfile_path }}"
    name: none
    fstype: swap
    opts: sw,nofail,pri=-1
    dump: "0"
    passno: "0"
    state: present

- name: Get active swap info
  ansible.builtin.command:
    argv:
      - swapon
      - --noheadings
      - --show=NAME
  register: swapfile_status
  changed_when: false

- name: Enable all configured swap devices
  ansible.builtin.command:
    argv:
      - swapon
      - --all
      - --verbose
  when:
    - swapfile_path not in swapfile_status.stdout_lines
    - not ansible_check_mode
  changed_when: true
