---
php_version: "8.5"

php_repository_suite: "{{ ansible_distribution_release | default('noble') }}"
php_repository:
  name: sury-php
  uri: https://packages.sury.org/php/
  component: main
  key: https://packages.sury.org/php/apt.gpg

php_fpm_socket: /run/php/php-fpm.sock

php_packages:
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-fpm"

php_module_packages: []
