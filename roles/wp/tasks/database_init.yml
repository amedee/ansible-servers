---
- name: Show interpreter discovery
  ansible.builtin.setup:
    gather_subset:
      - all

- name: Show discovered interpreter
  ansible.builtin.debug:
    msg: "{{ ansible_facts.discovered_interpreter_python }}"

- name: Verify PyMySQL package
  ansible.builtin.command:
    cmd: dpkg -l python3-pymysql
  changed_when: false

- name: Verify PyMySQL import
  ansible.builtin.command:
    cmd: python3 -c "import pymysql; print(pymysql.__version__)"
  changed_when: false

- name: Dump interpreter information
  ansible.builtin.debug:
    msg:
      - "ansible_python_interpreter={{ ansible_python_interpreter | default('undefined') }}"
      - "discovered={{ ansible_facts.discovered_interpreter_python | default('undefined') }}"

- name: Show Python executables
  shell: |
    which python3
    ls -l /usr/bin/python3
  changed_when: false
  register: wp_python_info

- debug:
    var: wp_python_info.stdout_lines

- name: Display connection type
  debug:
    var: ansible_connection

- name: Show MySQL version
  command: mysql -NBe "SELECT VERSION()"
  register: wp_mysql_version
  changed_when: false

- debug:
    var: wp_mysql_version.stdout

- name: Show authentication plugins
  command: mysql -NBe "SHOW PLUGINS"
  register: wp_mysql_plugins
  changed_when: false

- debug:
    var: wp_mysql_plugins.stdout_lines

- name: Show users and plugins
  command: >
    mysql -NBe
    "SELECT user,host,plugin FROM mysql.user"
  register: wp_mysql_users
  changed_when: false

- debug:
    var: wp_mysql_users.stdout_lines

- name: Create test user without password
  ansible.mysql.mysql_user:
    name: testuser
    host: localhost
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Show ansible.mysql version
  ansible.builtin.command: ansible-galaxy collection list ansible.mysql
  delegate_to: localhost
  register: wp_mysql_collection
  changed_when: false

- debug:
    var: wp_mysql_collection.stdout_lines



- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create WordPress database user
  ansible.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    host: "{{ wp_db_host }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: "{{ not lookup('env', 'MOLECULE_SCENARIO_NAME') }}"
