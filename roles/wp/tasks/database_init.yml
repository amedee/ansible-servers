---
- name: Show Python interpreter
  ansible.builtin.debug:
    var: ansible_facts.python

- name: Show Python executable
  ansible.builtin.debug:
    msg: "{{ ansible_facts.python.executable }}"

- name: Check PyMySQL import
  ansible.builtin.command:
    cmd: "{{ ansible_facts.python.executable }} -c 'import pymysql; print(pymysql.__version__)'"
  changed_when: false

- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create WordPress database user
  ansible.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    host: "{{ wp_db_host }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true
