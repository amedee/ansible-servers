---
- name: Show interpreter discovery
  ansible.builtin.setup:
    gather_subset:
      - all

- name: Show discovered interpreter
  ansible.builtin.debug:
    msg: "{{ ansible_facts.discovered_interpreter_python }}"

- name: Verify PyMySQL package
  ansible.builtin.command:
    cmd: dpkg -l python3-pymysql
  changed_when: false

- name: Verify PyMySQL import
  ansible.builtin.command:
    cmd: python3 -c "import pymysql; print(pymysql.__version__)"
  changed_when: false

- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create WordPress database user
  ansible.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    host: "{{ wp_db_host }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true
