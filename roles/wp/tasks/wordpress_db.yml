---
- name: Install MySQL
  ansible.builtin.apt:
    name:
      - mysql-client
      - php-mysql
      - python3-packaging
      - python3-pip
      - python3-pymysql

- name: "Create database '{{ wp_db_name }}'"
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: present
    login_user: "{{ wp_db_admin_user }}"
    login_password: "{{ wp_db_admin_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: "Create database user '{{ wp_db_user }}'"
  ansible.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    priv: "{{ wp_db_name }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_user: "{{ wp_db_admin_user }}"
    login_password: "{{ wp_db_admin_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true
