---
- name: Install AWS S3 dependencies
  ansible.builtin.apt:
    name:
      - python3-boto3

- name: Check if WordPress tables exist
  ansible.mysql.mysql_query:
    login_db: "{{ wp_db_name }}"
    query: SHOW TABLES FROM {{ wp_db_name }} LIKE 'wp_posts';
    login_user: "{{ wp_db_admin_user }}"
    login_password: "{{ wp_db_admin_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  register: wp_posts
  changed_when: false

- name: Get database dump from S3
  when:
    - (wp_posts.get('rowcount', [0]) | first | int) == 0
  amazon.aws.s3_object:
    bucket: backups-by-amedee
    object: "{{ wp_db_name }}.sql.xz"
    dest: "/tmp/{{ wp_db_name }}.sql.xz"
    mode: get
    overwrite: different
    access_key: "{{ aws_access_key }}"
    secret_key: "{{ aws_secret_key }}"
    region: us-east-1
  no_log: true

- name: Import database dump
  when:
    - not ansible_check_mode
    - (wp_posts.get('rowcount', [0]) | first | int) == 0
  ansible.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    state: import
    target: "/tmp/{{ wp_db_name }}.sql.xz"
    login_user: "{{ wp_db_admin_user }}"
    login_password: "{{ wp_db_admin_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
