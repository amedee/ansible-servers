---
- name: Create wp-cli cache directory
  ansible.builtin.file:
    path: /var/www/.wp-cli/cache
    state: directory
    owner: "{{ webserver_user }}"
    group: "{{ webserver_user }}"
    mode: "0750"

- name: Check if WordPress is already installed
  ansible.builtin.stat:
    path: "{{ webserver_directory }}/wp-includes/version.php"
  register: wp_core

- name: Download WordPress
  when: not wp_core.stat.exists
  become: true
  become_user: "{{ webserver_user }}"
  ansible.builtin.command:
    argv:
      - "{{ php_bin }}"
      - "{{ wp_cli_bin }}"
      - core
      - download
      - "--path={{ webserver_directory }}"
  changed_when: true

- name: Deploy wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ webserver_directory }}/wp-config.php"
    owner: "{{ webserver_user }}"
    group: "{{ webserver_user }}"
    mode: "0640"
  no_log: true
