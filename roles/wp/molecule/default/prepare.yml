---
- name: Prepare
  hosts: all
  become: true

  vars:
    letsencrypt_restore_enabled: false
    nginx_ssl_enabled: false
    keyring__dependent_gpg_keys:
      - id: 63AF7AA15067C05616FDDD88A3A2E8F226F0BC06

  roles:
    - mysql
    - redis
    - letsencrypt
    - php
    - nginx
    - keyring
    - wpcli
