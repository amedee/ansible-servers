---
- name: Verify custom DNS role behavior
  hosts: all
  gather_facts: false

  tasks:
    - name: Read DNS update calls
      ansible.builtin.slurp:
        src: /tmp/dns-update-calls
      register: mailinabox_dns_update_calls

    - name: Assert DNS update was called with --force
      ansible.builtin.assert:
        that:
          - "'--force' in (mailinabox_dns_update_calls.content | b64decode)"
