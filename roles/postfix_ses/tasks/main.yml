---
- name: Install deb822 repository dependency
  ansible.builtin.apt:
    name:
      - python3-debian
    state: present
    update_cache: true

- name: Enable Ubuntu Universe repository
  ansible.builtin.deb822_repository:
    name: ubuntu-universe
    types:
      - deb
    uris:
      - "http://archive.ubuntu.com/ubuntu"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
      - universe
      - restricted
      - multiverse
    state: present
    enabled: true

- name: Install SES wrapper dependencies
  ansible.builtin.apt:
    name:
      - python3-boto3
      - python3-botocore
      - python3-venv
    state: present
    update_cache: true

- name: Ensure SES system user exists
  ansible.builtin.user:
    name: ses
    state: present
    system: true
    comment: "Postfix SES transport user"
    shell: /usr/sbin/nologin
    create_home: false

- name: Deploy SES sendmail script
  ansible.builtin.copy:
    src: ses_sendmail.py
    dest: /usr/local/bin/ses_sendmail.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy SES wrapper script
  ansible.builtin.template:
    src: ses_wrapper.sh.j2
    dest: /usr/local/bin/ses_wrapper.sh
    owner: root
    group: ses
    mode: "0750"

- name: Ensure Postfix directory exists
  ansible.builtin.file:
    path: /etc/postfix/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SES transport map
  ansible.builtin.template:
    src: transport.pcre.j2
    dest: /etc/postfix/transport.pcre
    owner: root
    group: root
    mode: "0644"
