---
- name: Install apt-listchanges
  ansible.builtin.apt:
    name: apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 86400
    lock_timeout: 300

- name: Configure apt-listchanges
  ansible.builtin.copy:
    src: etc/apt/listchanges.conf
    dest: /etc/apt/listchanges.conf
    owner: root
    group: root
    mode: '0644'
