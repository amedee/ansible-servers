---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule-dovecot
        - /tmp/molecule-dovecot/mail
        - /tmp/molecule-dovecot/attachments

    - name: Create first test mail with image attachment
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/tmp/molecule-dovecot/mail/message-1"
        dest: /tmp/molecule-dovecot/mail/message-1
        mode: "0644"

    - name: Create second test mail with identical image attachment
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/tmp/molecule-dovecot/mail/message-2"
        dest: /tmp/molecule-dovecot/mail/message-2
        mode: "0644"

    - name: Run image attachment extraction
      ansible.builtin.command:
        cmd: /usr/local/bin/extract_image_attachments.sh
      environment:
        MAILDIR: /tmp/molecule-dovecot/mail
        SAVED_ATTACHMENTS: /tmp/molecule-dovecot/attachments
      changed_when: false

    - name: Find extracted JPEG attachments
      ansible.builtin.find:
        paths: /tmp/molecule-dovecot/attachments
        patterns: "*.jpg*"
        file_type: file
      register: dovecot_extracted_attachments

    - name: Assert duplicate attachments are deduplicated
      ansible.builtin.assert:
        that:
          - dovecot_extracted_attachments.matched == 1
