---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Create test mail directory
      ansible.builtin.file:
        path: /tmp/dovecot-test-mail
        state: directory
        mode: "0755"

    - name: Create test attachment directory
      ansible.builtin.file:
        path: /tmp/dovecot-test-attachments
        state: directory
        mode: "0755"

    - name: Create first test mail with image attachment
      ansible.builtin.copy:
        dest: /tmp/dovecot-test-mail/message-1
        mode: "0644"
        content: |
          From: test1@example.com
          To: amedee@example.com
          Subject: Test image 1
          MIME-Version: 1.0
          Content-Type: multipart/mixed; boundary="BOUNDARY"

          --BOUNDARY
          Content-Type: text/plain; charset="UTF-8"
          Content-Transfer-Encoding: 7bit

          Test message 1.

          --BOUNDARY
          Content-Type: image/jpeg; name="test.jpg"
          Content-Disposition: attachment; filename="test.jpg"
          Content-Transfer-Encoding: base64

          /9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP////////////////////////////////////////////////////////////////////////////////////
          //2wBDAf/////////////////////////////////////////////////////////////////////////////////////wAARCAABAAEDASIAAhEBAxEB
          

          --BOUNDARY--

    - name: Create second test mail with identical image attachment
      ansible.builtin.copy:
        dest: /tmp/dovecot-test-mail/message-2
        mode: "0644"
        content: |
          From: test2@example.com
          To: amedee@example.com
          Subject: Test image 2
          MIME-Version: 1.0
          Content-Type: multipart/mixed; boundary="BOUNDARY"

          --BOUNDARY
          Content-Type: text/plain; charset="UTF-8"
          Content-Transfer-Encoding: 7bit

          Test message 2.

          --BOUNDARY
          Content-Type: image/jpeg; name="test.jpg"
          Content-Disposition: attachment; filename="test.jpg"
          Content-Transfer-Encoding: base64

          /9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP////////////////////////////////////////////////////////////////////////////////////
          //2wBDAf/////////////////////////////////////////////////////////////////////////////////////wAARCAABAAEDASIAAhEBAxEB
          

          --BOUNDARY--

    - name: Run image attachment extraction
      ansible.builtin.command:
        cmd: /usr/local/bin/extract_image_attachments.sh
      environment:
        MAILDIR: /tmp/dovecot-test-mail
        SAVED_ATTACHMENTS: /tmp/dovecot-test-attachments
      changed_when: false

    - name: Find extracted JPEG attachments
      ansible.builtin.find:
        paths: /tmp/dovecot-test-attachments
        patterns: "*.jpg*"
        file_type: file
      register: dovecot_extracted_attachments

    - name: Assert duplicate attachments are deduplicated
      ansible.builtin.assert:
        that:
          - dovecot_extracted_attachments.matched == 1
