---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create directories for Mail-in-a-Box configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /home/user-data/dns
        - /home/user-data/www/default
        - /root/mailinabox/tools

    - name: Create dummy DNS update script
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "$@" >> /tmp/dns-update-calls
        dest: /root/mailinabox/tools/dns_update
        owner: root
        group: root
        mode: "0755"
