---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Add a previous managed environment block
      ansible.builtin.blockinfile:
        path: /etc/environment
        block: MOLECULE_OLD=obsolete

    - name: Add an unmanaged environment variable
      ansible.builtin.lineinfile:
        path: /etc/environment
        line: MOLECULE_UNMANAGED=preserved
        create: true
        mode: "0644"
