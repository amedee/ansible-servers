---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - "'hping3' in ansible_facts.packages"
          - "'munin-node' in ansible_facts.packages"
          - "'ufw' in ansible_facts.packages"
          - "'uptimed' in ansible_facts.packages"

    - name: Read munin-node configuration
      ansible.builtin.slurp:
        src: /etc/munin/munin-node.conf
      register: munin_node__configuration

    - name: Verify listener and access control are configured
      ansible.builtin.assert:
        that:
          - "'host *' in (munin_node__configuration.content | b64decode)"
          - "'port 4949' in (munin_node__configuration.content | b64decode)"
          - "'allow ^192\\.0\\.2\\.10$' in (munin_node__configuration.content | b64decode)"

    - name: Read plugin configuration
      ansible.builtin.slurp:
        src: /etc/munin/plugin-conf.d/zzz-ansible.conf
      register: munin_node__plugin_configuration

    - name: Verify plugin configuration is rendered
      ansible.builtin.assert:
        that:
          - "'[uptime]' in (munin_node__plugin_configuration.content | b64decode)"
          - "'user root' in (munin_node__plugin_configuration.content | b64decode)"

    - name: Check uptime plugin link
      ansible.builtin.stat:
        path: /etc/munin/plugins/uptime
      register: munin_node__uptime_plugin

    - name: Verify uptime plugin is enabled
      ansible.builtin.assert:
        that:
          - munin_node__uptime_plugin.stat.islnk

    - name: Check effective ProtectHome setting
      # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl show munin-node --property=ProtectHome --value
      register: munin_node_protecthome
      changed_when: false

    - name: Verify ProtectHome is disabled
      ansible.builtin.assert:
        that:
          - munin_node_protecthome.stdout == "no"

    - name: Check UFW status
      ansible.builtin.command:
        cmd: ufw status
      register: munin_node_ufw_status
      changed_when: false

    - name: Verify UFW is enabled
      ansible.builtin.assert:
        that:
          - "'Status: active' in munin_node_ufw_status.stdout"

    - name: Verify Munin firewall rule exists
      ansible.builtin.assert:
        that:
          - "'4949' in munin_node_ufw_status.stdout"
          - "'142.93.227.16' in munin_node_ufw_status.stdout"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify munin-node service exists
      ansible.builtin.assert:
        that:
          - "'munin-node.service' in ansible_facts.services"

    - name: Find enabled NTP Munin plugins
      ansible.builtin.find:
        paths: /etc/munin/plugins
        patterns: "ntp_*"
        file_type: link
      register: munin_node_ntp_plugins

    - name: Verify no NTP Munin plugins are enabled
      ansible.builtin.assert:
        that:
          - munin_node_ntp_plugins.files | length == 0
