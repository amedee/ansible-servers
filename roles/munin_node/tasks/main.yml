---
- name: Install Munin packages and UFW
  ansible.builtin.apt:
    name:
      - hping3
      - munin-node
      - ufw
      - uptimed
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure munin-node is enabled and running
  ansible.builtin.service:
    name: munin-node
    enabled: true
    state: started

- name: Create systemd override directory for munin-node
  ansible.builtin.file:
    path: /etc/systemd/system/munin-node.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow munin-node to read files in home directories
  ansible.builtin.copy:
    src: override.conf
    dest: /etc/systemd/system/munin-node.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart munin-node

- name: Find enabled NTP Munin plugins
  ansible.builtin.find:
    paths: /etc/munin/plugins
    patterns: "ntp_*"
    file_type: link
  register: munin_node_ntp_plugins

- name: Disable NTP Munin plugins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ munin_node_ntp_plugins.files }}"
  notify:
    - Restart munin-node

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled

- name: Allow Munin access to port 4949
  community.general.ufw:
    rule: allow
    port: 4949
    src: "{{ munin_node_server_ip }}"
