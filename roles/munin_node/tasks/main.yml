---
- name: Install Munin packages and UFW
  ansible.builtin.apt:
    name:
      - hping3
      - munin-node
      - ufw
      - uptimed
    state: present
    update_cache: true
    cache_valid_time: 86400 # One day
    lock_timeout: 300 # 5 minutes

- name: Configure munin-node
  ansible.builtin.template:
    src: munin-node.conf.j2
    dest: /etc/munin/munin-node.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart munin-node

- name: Configure munin plugins
  ansible.builtin.template:
    src: plugin-conf.j2
    dest: /etc/munin/plugin-conf.d/zzz-ansible.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart munin-node

- name: Install additional munin plugins
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ munin_node_plugin_src_path }}{{ item.src | basename }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ munin_node_install_plugins }}"
  notify: Restart munin-node

- name: Enable additional munin plugins
  ansible.builtin.file:
    path: "{{ munin_node_plugin_dest_path }}{{ item.name }}"
    src: "{{ munin_node_plugin_src_path }}{{ item.plugin | default(item.name) }}"
    state: link
  loop: "{{ munin_node_plugins }}"
  notify: Restart munin-node

- name: Ensure munin-node is enabled and running
  ansible.builtin.service:
    name: munin-node
    enabled: true
    state: started

- name: Create systemd override directory for munin-node
  ansible.builtin.file:
    path: /etc/systemd/system/munin-node.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow munin-node to read files in home directories
  ansible.builtin.copy:
    src: override.conf
    dest: /etc/systemd/system/munin-node.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart munin-node

- name: Find enabled NTP Munin plugins
  ansible.builtin.find:
    paths: /etc/munin/plugins
    patterns: "ntp_*"
    file_type: link
  register: munin_node_ntp_plugins

- name: Disable NTP Munin plugins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ munin_node_ntp_plugins.files }}"
  notify:
    - Restart munin-node

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled

- name: Allow Munin access to port 4949
  community.general.ufw:
    rule: allow
    port: 4949
    src: "{{ munin_node_server_ip }}"
