---
- name: Install MySQL
  become: true
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present

- name: Ensure MySQL is running
  become: true
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Check whether MySQL root uses socket authentication
  become: true
  ansible.builtin.command:
    argv:
      - mysql
      - --protocol=socket
      - --user=root
      - --skip-password
      - -e
      - "SELECT plugin FROM mysql.user WHERE User = 'root' AND Host = 'localhost';"
  register: mysql_root_socket_auth
  changed_when: false
  failed_when: false

- name: Check whether auth_socket plugin is installed
  become: true
  ansible.builtin.command:
    argv:
      - mysql
      - --defaults-extra-file=/etc/mysql/debian.cnf
      - --protocol=socket
      - -e
      - >-
        SELECT PLUGIN_STATUS
        FROM INFORMATION_SCHEMA.PLUGINS
        WHERE PLUGIN_NAME = 'auth_socket';
  register: mysql_auth_socket_plugin
  changed_when: false
  failed_when: false

- name: Install auth_socket plugin
  when:
    - "'auth_socket' not in mysql_root_socket_auth.stdout"
    - "'ACTIVE' not in mysql_auth_socket_plugin.stdout"
  become: true
  ansible.builtin.command:
    argv:
      - mysql
      - --defaults-extra-file=/etc/mysql/debian.cnf
      - --protocol=socket
      - -e
      - "INSTALL PLUGIN auth_socket SONAME 'auth_socket.so';"
  register: mysql_auth_socket_install
  changed_when: true

- name: Configure MySQL root authentication
  when: "'auth_socket' not in mysql_root_socket_auth.stdout"
  become: true
  ansible.builtin.command:
    argv:
      - mysql
      - --defaults-extra-file=/etc/mysql/debian.cnf
      - --protocol=socket
      - -e
      - "ALTER USER 'root'@'localhost' IDENTIFIED WITH auth_socket;"
  register: mysql_root_auth_configure
  changed_when: true

- name: Verify MySQL root uses socket authentication
  become: true
  ansible.builtin.command:
    argv:
      - mysql
      - --protocol=socket
      - --user=root
      - --skip-password
      - -e
      - "SELECT plugin FROM mysql.user WHERE User = 'root' AND Host = 'localhost';"
  register: mysql_root_socket_auth_verify
  changed_when: false
  failed_when: >
    mysql_root_socket_auth_verify.rc != 0 or
    'auth_socket' not in mysql_root_socket_auth_verify.stdout

- name: Disable binary logging in MySQL
  when: mysql_disable_binary_logging
  become: true
  community.general.ini_file:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    section: mysqld
    option: disable_log_bin
    allow_no_value: true
    create: false
    owner: root
    group: root
    mode: "0644"
  notify: Restart mysql
