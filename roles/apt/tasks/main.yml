---
- name: Install deb822 repository dependency
  ansible.builtin.apt:
    name:
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 86400 # One day
    lock_timeout: 300 # 5 minutes

- name: Configure Ubuntu package repositories
  ansible.builtin.deb822_repository:
    name: ubuntu
    types:
      - deb
    uris:
      - http://mirrors.digitalocean.com/ubuntu/
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
      - "{{ ansible_facts['distribution_release'] }}-updates"
      - "{{ ansible_facts['distribution_release'] }}-backports"
    components:
      - main
      - restricted
      - universe
      - multiverse
    signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  notify:
    - APT update

- name: Configure Ubuntu security repository
  ansible.builtin.deb822_repository:
    name: ubuntu-security
    types:
      - deb
    uris:
      - http://security.ubuntu.com/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}-security"
    components:
      - main
      - restricted
      - universe
      - multiverse
    signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  notify:
    - APT update

- name: Clear legacy sources.list
  ansible.builtin.copy:
    src: etc/apt/sources.list
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  notify:
    - APT update

- name: Disable APT Phasing
  ansible.builtin.copy:
    src: etc/apt/apt.conf.d/99disable-phasing
    dest: /etc/apt/apt.conf.d/99disable-phasing
    owner: root
    group: root
    mode: "0644"

- name: Remove unwanted packages
  ansible.builtin.apt:
    state: absent
    pkg: "{{ apt_packages_uninstall }}"
  notify:
    - APT autoclean
    - APT autoremove
