---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Get available Duplicity versions
      ansible.builtin.command:
        cmd: apt-cache madison duplicity
      register: duplicity_available_versions
      changed_when: false

    - name: Determine blocked Duplicity versions that are available
      ansible.builtin.set_fact:
        duplicity_available_blocked_versions: >-
          {{
            (
              duplicity_available_versions.stdout
              | regex_findall('(?m)^[^|]+\\|\\s*([^\\s|]+)')
            )
            | intersect(duplicity_blocked_versions)
            | list
          }}

    - name: Show available blocked Duplicity versions
      ansible.builtin.debug:
        msg: >-
          {{
            (
              'No blocked Duplicity versions are currently available in the APT '
              'repositories; version pinning checks skipped.'
            )
            if duplicity_available_blocked_versions | length == 0
            else
              'Testing blocked Duplicity versions: '
              ~ (duplicity_available_blocked_versions | join(', '))
          }}

    - name: Get APT policy for available blocked Duplicity versions
      ansible.builtin.command:
        cmd: apt-cache policy duplicity
      register: duplicity_apt_policy
      changed_when: false
      when: duplicity_available_blocked_versions | length > 0

    - name: Verify available blocked versions have priority -1
      ansible.builtin.assert:
        that:
          - >-
            duplicity_apt_policy.stdout is search(
              '(?m)^\\s*' ~ (item | regex_escape) ~ '\\s+-1\\s*$'
            )
        fail_msg: >-
          Duplicity version {{ item }} does not have APT priority -1.
          APT policy:
          {{ duplicity_apt_policy.stdout }}
      loop: "{{ duplicity_available_blocked_versions }}"

    - name: Attempt to install available blocked versions
      ansible.builtin.apt:
        name: "duplicity={{ item }}"
        state: present
      register: duplicity_install_attempt
      failed_when: false
      loop: "{{ duplicity_available_blocked_versions }}"

    - name: Assert blocked versions cannot be installed
      ansible.builtin.assert:
        that:
          - item.failed
        fail_msg: >-
          Duplicity version {{ item.item }} was unexpectedly installable.
          {{ item.msg | default('') }}
      loop: "{{ duplicity_install_attempt.results }}"

    - name: Create test Duplicity package
      ansible.builtin.copy:
        content: "Molecule test package"
        dest: /root/duplicity_molecule_test.deb
        mode: "0644"

    - name: Remove any previous backup of test Duplicity package
      ansible.builtin.file:
        path: /var/backups/debs/duplicity/
        state: absent

    - name: Remove Duplicity
      ansible.builtin.apt:
        name: duplicity
        state: absent

    - name: Install Duplicity to trigger APT post-invoke hook
      ansible.builtin.apt:
        name: duplicity
        state: present

    - name: Find backed up Duplicity packages
      ansible.builtin.find:
        paths: /var/backups/debs/duplicity
        patterns: "duplicity_*.deb"
        file_type: file
      register: duplicity_backups

    - name: Verify Duplicity packages were backed up
      ansible.builtin.assert:
        that:
          - duplicity_backups.matched == 2
        fail_msg: >-
          Expected two Duplicity packages in the backup directory,
          found {{ duplicity_backups.matched }}.
        success_msg: >-
          APT backup hook successfully backed up:
          {{ duplicity_backups.files | map(attribute='path') | map('basename') | join(', ') }}
