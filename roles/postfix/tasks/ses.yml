---
- name: Install SES wrapper dependencies
  ansible.builtin.apt:
    name:
      - python3-boto3
      - python3-botocore
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 86400 # One day
    lock_timeout: 300 # 5 minutes

- name: Ensure SES system user exists
  ansible.builtin.user:
    name: ses
    state: present
    system: true
    comment: "Postfix SES transport user"
    shell: /usr/sbin/nologin
    create_home: false

- name: Deploy SES sendmail script
  ansible.builtin.copy:
    src: usr/local/bin/ses_sendmail.py
    dest: /usr/local/bin/ses_sendmail.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy SES wrapper script
  ansible.builtin.template:
    src: usr/local/bin/ses_wrapper.sh.j2
    dest: /usr/local/bin/ses_wrapper.sh
    owner: root
    group: ses
    mode: "0750"

- name: Ensure Postfix directory exists
  ansible.builtin.file:
    path: /etc/postfix/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SES transport map
  ansible.builtin.template:
    src: etc/postfix/transport.pcre.j2
    dest: /etc/postfix/transport.pcre
    owner: root
    group: root
    mode: "0644"
