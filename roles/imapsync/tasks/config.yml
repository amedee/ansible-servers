---
- name: Install imapsync credentials
  ansible.builtin.template:
    src: root/.imapsync-creds.j2
    dest: "{{ imapsync_creds_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Install imapsync sync script
  ansible.builtin.template:
    src: usr/local/sbin/imapsync.sh.j2
    dest: "{{ imapsync_script_path }}"
    owner: root
    group: root
    mode: '0750'
