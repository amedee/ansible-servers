---
- name: Install hadori
  ansible.builtin.apt:
    name:
      - hadori
    state: present
    update_cache: true
    cache_valid_time: 86400 # One day
    lock_timeout: 300 # 5 minutes

- name: Configure cron job for hadori
  ansible.builtin.copy:
    src: hadori-cron
    dest: /etc/cron.d/hadori
    owner: root
    group: root
    mode: "0644"
