---
- name: Base configuration for all hosts
  hosts: all
  gather_facts: false

  vars:
    journald__configuration:
      - 'MaxRetentionSec': '1month'
      - 'SystemKeepFree': '2G'
      - 'SystemMaxFileSize': '100M'
      - 'SystemMaxUse': '1G'

    munin_node_config: >-
      {{
        (munin_node_config_base | default({}))
        | combine(munin_node_config_extra | default({}), recursive=True)
      }}
    munin_node_install_plugins: >-
      {{
        (munin_node_install_plugins_base | default([]))
        + (munin_node_install_plugins_extra | default([]))
      }}
    munin_node_plugins: >-
      {{
        (munin_node_plugins_base | default([]))
        + (munin_node_plugins_extra | default([]))
      }}

  pre_tasks:
    - name: Gather minimal facts for APT, postfix, ufw, munin-node
      ansible.builtin.setup:
        filter:
          - ansible_distribution_release
          - ansible_hostname
          - ansible_os_family
          - ansible_virtualization_role
        gather_subset:
          - virtual
          - hardware
          - network

  roles:
    - swapfile
    - apt
    - base_linux
    - localepurge
    - hadori
    - etckeeper
    - etc_aliases
    - debops.debops.apt_listchanges
    - debops.debops.unattended_upgrades
    - debops.debops.journald
    - munin_node
    - postfix
    - magic

- name: Configure Mail-in-a-Box servers
  hosts: mailservers
  gather_facts: false

  pre_tasks:
    - name: Gather minimal facts for ufw
      ansible.builtin.setup:
        filter:
          - ansible_os_family

  roles:
    - debops.debops.environment
    - imapsync
    - mailinabox
    - dovecot
    - duplicity
    - munin

- name: Configure WordPress servers
  hosts: blogs
  gather_facts: false

  roles:
    - mysql
    - redis
    - php
    - nginx
    - letsencrypt
    - keyring
    - wpcli
    - wp

- name: Reboot servers if needed
  hosts: all
  become: true

  tasks:
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
