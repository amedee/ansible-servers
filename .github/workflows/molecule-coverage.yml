---
name: 🧪 Molecule Coverage

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - 'roles/**/molecule/**'
      - '.github/scripts/molecule_coverage.py'
      - '.github/workflows/molecule.yml'
      - '.github/workflows/molecule-coverage.yml'
      - 'README.md'
      - "!roles/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: 🔍 Discover Molecule scenarios
    uses: ./.github/workflows/molecule-discover.yml

  coverage:
    name: Calculate Molecule coverage
    needs: discover
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🐍 Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-pip
        with:
          requirements-file: ".github/requirements-molecule.txt"

      - name: Generate coverage
        env:
          ROLES: ${{ needs.discover.outputs.roles }}
          SCENARIOS: ${{ needs.discover.outputs.scenarios }}
        run: |
          python3 .github/scripts/molecule_coverage.py coverage \
            --roles "${ROLES}" \
            --scenarios "${SCENARIOS}" \
            --readme README.md \
            --badge-directory badge \
            --summary-output "${GITHUB_STEP_SUMMARY}"

      - name: Publish badge
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badge
          force_orphan: true

      - name: Format Markdown
        uses: ./.github/actions/format-markdown
        with:
          files: README.md

      - name: Detect generated README changes
        id: changes
        run: |
          git add README.md

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git diff --cached

      - name: 🔁 Commit and Push
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/commit-and-push
        with:
          commit-message: "docs: update Molecule coverage"
