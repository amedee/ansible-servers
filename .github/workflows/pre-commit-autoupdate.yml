---
name: 🤖 Pre-commit autoupdate

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pre-commit-autoupdate.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    name: ⏫ Pre-commit autoupdate
    runs-on: ubuntu-slim
    environment: production

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: ⏬ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🐍 Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-pip
        with:
          python-version: "3.13"
          requirements-file: ".github/requirements-ci.txt"

      - name: 💾 Cache pre-commit environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: 🧹 Run pre-commit autoupdate
        run: pre-commit autoupdate

      - name: Stage changed file
        run: git add .pre-commit-config.yaml

      - name: Detect pre-commit changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git diff --cached

      - name: 🔁 Commit and Push
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "⬆️ Pre-commit autoupdate"
          git restore --worktree -- .

          retries=0
          while [ "$retries" -lt 3 ]; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            retries=$((retries + 1))
            echo "Push failed, retrying ($retries/3)..."
          done

          exit 1
