---
name: 🛠️ Code Quality — Validate Configs

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ format(
    'code-quality-validate-configs-{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: validate-configs
    runs-on: ubuntu-latest
    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run validate-configs
        # yamllint disable-line rule:line-length
        uses: kehoecj/validate-configs-action@55242af1509991b2b18e2cf120eb4083a33e5c4b # v4.0.1
