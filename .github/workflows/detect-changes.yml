---
name: Detect production changes

on: # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      production:
        description: Whether production files changed
        value: ${{ jobs.detect.outputs.production }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: 🔎 Detect production changes
    runs-on: ubuntu-slim
    outputs:
      production: ${{ steps.filter.outputs.production }}

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            production:
              - 'inventory/**'
              - 'playbooks/**'
              - 'roles/**'
              - 'ansible.cfg'
              - 'requirements.yml'
              - '.github/workflows/ansible-run.yml'
              - '.github/workflows/pipeline.yml'
              - '!**/molecule/**'
              - '!**/*.md'
