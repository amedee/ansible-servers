---
name: Detect production changes

on: # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      production:
        description: Whether production files changed
        value: ${{ jobs.detect.outputs.production }}

permissions:
  contents: read

jobs:
  detect:
    name: 🔎 Detect production changes
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.filter.outputs.production }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            production:
              - 'inventory/**'
              - 'playbooks/**'
              - 'roles/**'
              - 'ansible.cfg'
              - 'requirements.yml'
              - '.github/workflows/ansible-run.yml'
              - '.github/workflows/pipeline.yml'
              - '!**/molecule/**'
              - '!**/*.md'
