---
name: Update Host

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      host:
        required: true
        type: string

    secrets:
      SSH_PRIVATE_KEY:
        required: true

      VAULT_PASSWORD:
        required: true

permissions:
  contents: read

env:
  ANSIBLE_CONFIG: ansible.cfg

jobs:
  update:
    name: Update ${{ inputs.host }}
    runs-on: ubuntu-26.04
    environment: production

    concurrency:
      group: ${{ format('update-host-{0}', inputs.host) }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Ansible cache
        uses: ./.github/actions/restore-ansible-cache

      - name: Run updates
        run: |
          .github/scripts/ansible-retry.sh
        env:
          ANSIBLE_HOST: ${{ inputs.host }}
          ANSIBLE_PLAYBOOK: playbooks/update.yml
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

      - name: Generate Ansible summary
        if: always()
        run: |
          python3 .github/scripts/ansible_summary.py ~/.ansible/ansible.log \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Ansible log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-${{ inputs.host }}.log
          path: ~/.ansible/ansible.log
          compression-level: 9
          overwrite: true
