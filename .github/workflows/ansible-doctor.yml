---
name: 📚 Ansible Role Docs

on: # yamllint disable-line rule:truthy
  push:
    paths:
      - ".github/workflows/ansible-doctor.yml"
      - "requirements-docs.txt"
      - "roles/**/.ansibledoctor/**"
      - "roles/**/defaults/main.yml"
      - "roles/**/meta/main.yml"
  workflow_dispatch:

concurrency:
  group: ansible-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-26.04

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🐍 Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-pip
        with:
          requirements-file: "requirements-docs.txt"

      - name: Run ansible-doctor
        run: ansible-doctor -v --force --recursive roles

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Format Markdown
        run: npx --yes prettier --write roles/*/README.md

      - name: Detect generated README changes
        id: changes
        run: |
          git add roles/*/README.md

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git diff --cached

      - name: 🔁 Commit and Push
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/commit-and-push
        with:
          commit-message: "docs: update generated Ansible role documentation"
