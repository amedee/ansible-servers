---
name: 🚀 Ansible Run

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      VAULT_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  deploy-web:
    name: Deploy amedee.be
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: amedee.be
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

  deploy-mail:
    name: Deploy box.vangasse.eu
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: box.vangasse.eu
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

  smoke-web:
    name: Smoke Test amedee.be
    needs: deploy-web
    uses: ./.github/workflows/smoke-test-web.yml
    with:
      host: amedee.be

  smoke-mail:
    name: Smoke Test box.vangasse.eu
    needs: deploy-mail
    uses: ./.github/workflows/smoke-test-mail.yml
    with:
      host: box.vangasse.eu
