---
name: 🧪 Molecule Tests

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ format(
    'molecule-{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: 🔍 Discover scenarios
    uses: ./.github/workflows/molecule-discover.yml

  molecule:
    name: ${{ matrix.scenario.role }}-${{ matrix.scenario.scenario }}
    needs: discover

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.discover.outputs.scenarios) }}

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python-pip
        with:
          python-version: "3.11"
          requirements-file: .github/requirements-molecule.txt

      - name: Restore Ansible cache
        uses: ./.github/actions/restore-ansible-cache

      - name: Run Molecule
        run: molecule test -s "${MATRIX_SCENARIO}"
        working-directory: roles/${{ matrix.scenario.role }}
        env:
          MATRIX_SCENARIO: ${{ matrix.scenario.scenario }}
