---
name: 🧪🧼🚀 Wash, Test, Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "inventory/**"
      - "playbooks/**"
      - "roles/**"
      - "!**/*.md"
  schedule:
    - cron: "10 3 * * SAT"
  workflow_dispatch:

concurrency:
  group: ${{ format(
    'pipeline-{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-linter:
    name: 🛠️ Code Quality — Super-Linter
    permissions:
      actions: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/code-quality-super-linter.yml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANSIBLE_DEP_UPDATER_TOKEN: ${{ secrets.ANSIBLE_DEP_UPDATER_TOKEN }}

  pylint:
    name: 🛠️ Code Quality — Pylint
    uses: ./.github/workflows/code-quality-pylint.yml

  validate-configs:
    name: 🛠️ Code Quality — Validate Configs
    uses: ./.github/workflows/code-quality-validate-configs.yml

  ansible-lint:
    name: 🛠️ Code Quality — Ansible Lint
    uses: ./.github/workflows/code-quality-ansible-lint.yml

  molecule:
    name: 🧪 Molecule Tests
    uses: ./.github/workflows/molecule.yml

  detect-changes:
    name: 🔎 Detect production changes
    runs-on: ubuntu-26.04

    outputs:
      production: ${{ steps.filter.outputs.production }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            production:
              - 'inventory/**'
              - 'playbooks/**'
              - 'roles/**'
              - '!**/molecule/**'
              - '!**/*.md'
          list-files: "shell"

  deploy:
    name: 🚀 Deploy to Production
    if: >
      github.event_name != 'schedule' &&
      needs.detect-changes.outputs.production == 'true'
    needs:
      - super-linter
      - ansible-lint
      - molecule
      - pylint
      - validate-configs
      - detect-changes
    uses: ./.github/workflows/ansible-run.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
