---
name: 🧪🧼🚀 Wash, Test, Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "inventory/**"
      - "playbooks/site.yml"
      - "roles/**"
      - "!**/*.md"
  schedule:
    - cron: "10 3 * * SAT"
  workflow_dispatch:

concurrency:
  group: ${{ format(
    'pipeline-{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-linter:
    name: 🛠️ Code Quality — Super-Linter
    permissions:
      actions: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/code-quality-super-linter.yml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANSIBLE_DEP_UPDATER_TOKEN: ${{ secrets.ANSIBLE_DEP_UPDATER_TOKEN }}

  pylint:
    name: 🛠️ Code Quality — Pylint
    uses: ./.github/workflows/code-quality-pylint.yml

  validate-configs:
    name: 🛠️ Code Quality — Validate Configs
    uses: ./.github/workflows/code-quality-validate-configs.yml

  ansible-lint:
    name: 🛠️ Code Quality — Ansible Lint
    uses: ./.github/workflows/code-quality-ansible-lint.yml

  molecule:
    name: 🧪 Molecule Tests
    uses: ./.github/workflows/molecule.yml

  deploy:
    name: 🚀 Deploy to Production
    needs:
      - super-linter
      - ansible-lint
      - molecule
      - pylint
      - validate-configs
    uses: ./.github/workflows/ansible-run.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
