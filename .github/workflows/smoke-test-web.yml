---
name: Smoke Test Web

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      host:
        required: true
        type: string
        default: amedee.be

  workflow_call:
    inputs:
      host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test-web:
    name: Smoke Test ${{ inputs.host }}
    runs-on: ubuntu-26.04

    steps:
      - name: Verify homepage
        id: homepage
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          output="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --write-out '%{http_code} %{size_download}' \
              "https://${INPUTS_HOST}/" \
              2>/dev/null \
              | tail -1
          )"

          status="$(echo "$output" | awk '{print $1}')"
          size="$(echo "$output" | awk '{print $2}')"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Verify FastCGI cache
        id: fastcgi_cache
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          first="$(
            curl \
              --silent \
              --show-error \
              --head \
              "https://${INPUTS_HOST}/" \
              | tr -d '\r' \
              | awk '
                  BEGIN { IGNORECASE=1 }
                  tolower($1) == "x-fastcgi-cache:" { print $2 }
                '
          )"

          sleep 1

          second="$(
            curl \
              --silent \
              --show-error \
              --head \
              "https://${INPUTS_HOST}/" \
              | tr -d '\r' \
              | awk '
                  BEGIN { IGNORECASE=1 }
                  tolower($1) == "x-fastcgi-cache:" { print $2 }
                '
          )"

          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "second=$second" >> "$GITHUB_OUTPUT"

          test -n "$first"
          test "$second" = "HIT"

      - name: Verify FastCGI cache bypass
        id: fastcgi_cache_bypass
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          status="$(
            curl \
              --silent \
              --show-error \
              --head \
              "https://${INPUTS_HOST}/?smoketest=$(date +%s)" \
              | tr -d '\r' \
              | awk '
                  BEGIN { IGNORECASE=1 }
                  tolower($1) == "x-fastcgi-cache:" { print $2 }
                '
          )"

          echo "status=$status" >> "$GITHUB_OUTPUT"

          test "$status" = "BYPASS"

      - name: Verify HTTP to HTTPS redirect
        id: redirect
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          headers="$(mktemp)"

          curl \
            --silent \
            --output /dev/null \
            --dump-header "$headers" \
            "http://${INPUTS_HOST}/"

          status="$(
            awk 'NR == 1 {print $2}' "$headers"
          )"

          location="$(
            awk 'BEGIN{IGNORECASE=1}
                /^Location:/ {print $2}' "$headers" \
            | tr -d '\r'
          )"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "location=$location" >> "$GITHUB_OUTPUT"

          test "$status" = "301" \
            || test "$status" = "302" \
            || test "$status" = "307" \
            || test "$status" = "308"

          test "$location" = "https://${INPUTS_HOST}/"

      - name: Verify WordPress login page
        id: wp_login
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          output="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --write-out '%{http_code} %{size_download}' \
              "https://${INPUTS_HOST}/wp-login.php" \
              2>/dev/null \
              | tail -1
          )"

          status="$(echo "$output" | awk '{print $1}')"
          size="$(echo "$output" | awk '{print $2}')"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Verify SSL certificate
        id: ssl_cert
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          cert_info="$(
            echo | openssl s_client \
              -servername "${INPUTS_HOST}" \
              -connect "${INPUTS_HOST}:443" \
              -verify_return_error \
              2>&1 \
              | openssl x509 -noout -dates -subject
          )"

          echo "$cert_info"

          expires="$(
            echo "$cert_info" \
              | grep 'notAfter=' \
              | cut -d= -f2
          )"

          issuer="$(
            echo "$cert_info" \
              | grep 'subject=' \
              | grep -oE 'CN = [^/]+|CN=[^/]+|CN =[^/]+' \
              | sed 's/CN[ =]//' \
              | head -n 1
          )"

          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "issuer=$issuer" >> "$GITHUB_OUTPUT"

      - name: Verify WordPress REST API
        id: wp_rest
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          json="$(
            curl \
              --fail \
              --silent \
              --show-error \
              "https://${INPUTS_HOST}/wp-json/"
          )"

          echo "$json" | grep -q '"name"'

          site_name="$(
            echo "$json" \
              | grep -oE '"name":"[^"]*"' \
              | head -n 1 \
              | cut -d'"' -f4
          )"

          posts_count="$(
            curl \
              --silent \
              --head \
              "https://${INPUTS_HOST}/wp-json/wp/v2/posts?per_page=1" \
              | grep -i '^X-WP-Total:' \
              | awk '{print $2}' \
              | tr -d '\r'
          )"

          echo "site_name=$site_name" >> "$GITHUB_OUTPUT"
          echo "posts_count=$posts_count" >> "$GITHUB_OUTPUT"

      - name: Verify RSS feed
        id: rss_feed
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          feed="$(
            curl \
              --fail \
              --silent \
              --show-error \
              "https://${INPUTS_HOST}/feed/"
          )"

          echo "$feed" | grep -q '<rss'

          item_count="$(
            echo "$feed" \
              | grep -c '<item>'
          )"

          latest_title="$(
            echo "$feed" \
              | tr '\n' ' ' \
              | grep -oP '<item>\s*<title>\K[^<]+' \
              | head -n 1
          )"

          echo "item_count=$item_count" >> "$GITHUB_OUTPUT"
          echo "latest_title=$latest_title" >> "$GITHUB_OUTPUT"

      - name: Verify security headers
        id: security_headers
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          headers="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --dump-header "$headers" \
            --output /dev/null \
            "https://${INPUTS_HOST}/"

          hsts="$(
            awk '
              BEGIN { IGNORECASE=1 }
              tolower($1) == "strict-transport-security:" {
                sub(/\r$/, "")
                $1 = ""
                sub(/^[[:space:]]+/, "")
                print
              }
            ' "$headers"
          )"

          echo "HSTS: ${hsts}"

          test -n "$hsts"

          max_age="$(
            printf '%s\n' "$hsts" \
              | grep -oiE 'max-age=[0-9]+' \
              | head -n 1 \
              | cut -d= -f2
          )"

          test -n "$max_age"
          test "$max_age" -gt 0

          echo "max_age=$max_age" >> "$GITHUB_OUTPUT"

      - name: Verify 404 handling
        id: not_found
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${INPUTS_HOST}/nonexistent-page-12345/"
          )"

          echo "status=$status" >> "$GITHUB_OUTPUT"

          test "$status" = "404"

      - name: Verify response time
        id: response_time
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          time="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{time_total}' \
              "https://${INPUTS_HOST}/"
          )"

          awk "BEGIN {exit !(${time} < 10)}"

          echo "time=$time" >> "$GITHUB_OUTPUT"

      - name: Generate smoke-test summary
        if: always()
        env:
          HOMEPAGE_RESULT: >-
            ${{ steps.homepage.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          HOMEPAGE_DETAILS: >-
            HTTP `${{ steps.homepage.outputs.status || 'N/A' }}`, `${{ steps.homepage.outputs.size || 'N/A' }}` bytes

          FASTCGI_CACHE_RESULT: >-
            ${{ steps.fastcgi_cache.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          FASTCGI_CACHE_DETAILS: >-
            first=`${{ steps.fastcgi_cache.outputs.first || 'N/A' }}`,
            second=`${{ steps.fastcgi_cache.outputs.second || 'N/A' }}`

          FASTCGI_CACHE_BYPASS_RESULT: >-
            ${{ steps.fastcgi_cache_bypass.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          FASTCGI_CACHE_BYPASS_DETAILS: >-
            status=`${{ steps.fastcgi_cache_bypass.outputs.status || 'N/A' }}`

          REDIRECT_RESULT: >-
            ${{ steps.redirect.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          REDIRECT_DETAILS: >-
            Status: `${{ steps.redirect.outputs.status || 'N/A' }}`,
            Location: `${{ steps.redirect.outputs.location || 'N/A' }}`

          WP_LOGIN_RESULT: >-
            ${{ steps.wp_login.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          WP_LOGIN_DETAILS: >-
            HTTP `${{ steps.wp_login.outputs.status || 'N/A' }}`, `${{ steps.wp_login.outputs.size || 'N/A' }}` bytes

          SSL_CERT_RESULT: >-
            ${{ steps.ssl_cert.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          SSL_CERT_DETAILS: >-
            expires=`${{ steps.ssl_cert.outputs.expires || 'N/A' }}`,
            issuer=`${{ steps.ssl_cert.outputs.issuer || 'N/A' }}`

          WP_REST_RESULT: >-
            ${{ steps.wp_rest.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          WP_REST_DETAILS: >-
            name=`${{ steps.wp_rest.outputs.site_name || 'N/A' }}`,
            posts=`${{ steps.wp_rest.outputs.posts_count || 'N/A' }}`

          RSS_FEED_RESULT: >-
            ${{ steps.rss_feed.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          RSS_FEED_DETAILS: >-
            items=`${{ steps.rss_feed.outputs.item_count || 'N/A' }}`,
            latest=`${{ steps.rss_feed.outputs.latest_title || 'N/A' }}`

          SECURITY_HEADERS_RESULT: >-
            ${{ steps.security_headers.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          SECURITY_HEADERS_DETAILS: >-
            max-age=`${{ steps.security_headers.outputs.max_age || 'N/A' }}`

          NOT_FOUND_RESULT: >-
            ${{ steps.not_found.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          NOT_FOUND_DETAILS: >-
            HTTP `${{ steps.not_found.outputs.status || 'N/A' }}`

          RESPONSE_TIME_RESULT: >-
            ${{ steps.response_time.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          RESPONSE_TIME_DETAILS: >-
            ${{ steps.response_time.outputs.time || 'N/A' }}s

          INPUTS_HOST: ${{ inputs.host }}

        run: |
          {
            echo "# Smoke Test Summary"
            echo
            echo "Host: \`${INPUTS_HOST}\`"
            echo
            echo "| Test | Result | Details |"
            echo "|------|--------|---------|"
            echo "| Homepage | ${HOMEPAGE_RESULT} | ${HOMEPAGE_DETAILS} |"
            echo "| FastCGI cache | ${FASTCGI_CACHE_RESULT} | ${FASTCGI_CACHE_DETAILS} |"
            echo "| FastCGI cache bypass | ${FASTCGI_CACHE_BYPASS_RESULT} | ${FASTCGI_CACHE_BYPASS_DETAILS} |"
            echo "| HTTP→HTTPS redirect | ${REDIRECT_RESULT} | ${REDIRECT_DETAILS} |"
            echo "| WordPress login page | ${WP_LOGIN_RESULT} | ${WP_LOGIN_DETAILS} |"
            echo "| SSL certificate | ${SSL_CERT_RESULT} | ${SSL_CERT_DETAILS} |"
            echo "| WordPress REST API | ${WP_REST_RESULT} | ${WP_REST_DETAILS} |"
            echo "| RSS feed | ${RSS_FEED_RESULT} | ${RSS_FEED_DETAILS} |"
            echo "| Security headers (HSTS) | ${SECURITY_HEADERS_RESULT} | ${SECURITY_HEADERS_DETAILS} |"
            echo "| 404 handling | ${NOT_FOUND_RESULT} | ${NOT_FOUND_DETAILS} |"
            echo "| Response time (<10s) | ${RESPONSE_TIME_RESULT} | ${RESPONSE_TIME_DETAILS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any smoke test failed
        if: >-
          steps.homepage.outcome != 'success' ||
          steps.fastcgi_cache.outcome != 'success' ||
          steps.fastcgi_cache_bypass.outcome != 'success' ||
          steps.redirect.outcome != 'success' ||
          steps.wp_login.outcome != 'success' ||
          steps.ssl_cert.outcome != 'success' ||
          steps.wp_rest.outcome != 'success' ||
          steps.rss_feed.outcome != 'success' ||
          steps.security_headers.outcome != 'success' ||
          steps.not_found.outcome != 'success' ||
          steps.response_time.outcome != 'success'
        run: exit 1
