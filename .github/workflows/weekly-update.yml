---
name: 🔄 Weekly Update

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 4 * * 6" # Every Saturday at 04:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: Target host(s) to update
        required: true
        default: both
        type: choice
        options:
          - both
          - web
          - mail

permissions:
  contents: read

jobs:
  update-web:
    name: Update amedee.be
    if: ${{ github.event_name != 'workflow_dispatch' || contains('both,web', github.event.inputs.target) }}
    uses: ./.github/workflows/update-host.yml
    with:
      host: amedee.be
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

  update-mail:
    name: Update box.vangasse.eu
    if: ${{ github.event_name != 'workflow_dispatch' || contains('both,mail', github.event.inputs.target) }}
    uses: ./.github/workflows/update-host.yml
    with:
      host: box.vangasse.eu
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}

  smoke-web:
    name: Smoke Test amedee.be
    needs: update-web
    if: ${{ github.event_name != 'workflow_dispatch' || contains('both,web', github.event.inputs.target) }}
    uses: ./.github/workflows/smoke-test-web.yml
    with:
      host: amedee.be

  smoke-mail:
    name: Smoke Test box.vangasse.eu
    needs: update-mail
    if: ${{ github.event_name != 'workflow_dispatch' || contains('both,mail', github.event.inputs.target) }}
    uses: ./.github/workflows/smoke-test-mail.yml
    with:
      host: box.vangasse.eu
