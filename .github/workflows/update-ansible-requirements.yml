---
name: ⬆️ Update Ansible Requirements

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements.yml"
      - ".github/actions/setup-python-pip/action.yml"
      - ".github/scripts/update_ansible_requirements.py"
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ format(
    '{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  update-ansible-deps:
    runs-on: ubuntu-26.04
    environment: production

    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🐍 Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-pip
        with:
          requirements-file: "requirements.txt"

      - name: 🔄 Update requirements.yml
        run: python .github/scripts/update_ansible_requirements.py

      - name: Stage requirements
        run: git add requirements.yml

      - name: Detect requirements changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git diff --cached

      - name: 🔁 Commit and Push
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/commit-and-push
        with:
          commit-message: "⬆️ Update Ansible requirements"

      - name: Trigger pipeline
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        run: gh workflow run pipeline.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
