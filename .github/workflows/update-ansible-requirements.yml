---
name: ⬆️ Update Ansible Requirements

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ansible-requirements.yml"
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-ansible-deps:
    runs-on: ubuntu-slim
    environment: production
    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: ⤵️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🐍 Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-pip
        with:
          python-version: "3.13"
          requirements-file: "requirements.txt"

      - name: 🔄 Update requirements.yml
        run: python .github/scripts/update_ansible_requirements.py

      - name: Stage requirements
        run: git add requirements.yml

      - name: Detect requirements changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git diff --cached

      - name: 🔁 Commit and Push
        if: |
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "⬆️ Update Ansible requirements"
          git restore --worktree -- .

          retries=0
          while [ "$retries" -lt 3 ]; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            retries=$((retries + 1))
            echo "Push failed, retrying ($retries/3)..."
          done

          exit 1

      - name: Trigger pipeline
        if: steps.changes.outputs.has_changes == 'true'
        run: gh workflow run pipeline.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
