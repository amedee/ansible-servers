---
name: 🛠️ Code Quality — ESLint

on: # yamllint disable-line rule:truthy
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-slim
    if: github.event_name != 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Check for NodeJS custom action
        id: check_nodejs_actions
        shell: bash
        run: |
          if compgen -G ".github/actions/*/package.json" > /dev/null; then
            echo "has_nodejs_actions=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Node.js custom actions found."
            echo "has_nodejs_actions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ⚡ Set up Node.js
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: 📦 Install root dependencies
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        run: npm ci

      - name: 🛠 Install dependencies for custom actions
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        run: |
          echo "Scanning for action directories with package.json..."
          for dir in .github/actions/*; do
            if [ -f "$dir/package.json" ]; then
              echo "::group::Installing dependencies in $dir"
              echo "📂 Directory: $dir"
              echo "📄 package.json contents:"
              cat "$dir/package.json"
              echo ""
              echo "📦 Installing..."
              npm ci --prefix "$dir"
              echo "::endgroup::"
            else
              echo "Skipping $dir — no package.json found."
            fi
          done

      - name: Check ESLint version
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        run: npx eslint --version

      - name: 📦 Cache npm and action node_modules
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            node_modules
            .github/actions/**/node_modules
          key: >
            ${{ runner.os }}-eslint-
            ${{ hashFiles('package-lock.json') }}-
            ${{ hashFiles('.github/actions/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: 🔍 Run ESLint
        if: steps.check_nodejs_actions.outputs.has_nodejs_actions == 'true'
        run: |
          echo "Starting ESLint scan..."
          npx eslint \
            --max-warnings=0 \
            --color \
            '.github/actions/*/*.js'
