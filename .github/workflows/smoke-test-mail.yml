---
name: Smoke Test Mail

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      host:
        required: true
        type: string
        default: box.vangasse.eu

  workflow_call:
    inputs:
      host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-26.04

    steps:
      - name: Verify SMTP banner (25)
        id: smtp
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          echo "QUIT" | nc -w 5 "${INPUTS_HOST}" 25 | grep -q '220'

      - name: Verify Submission STARTTLS (587)
        id: submission
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          echo "EHLO smoke-test" | nc -w 5 "${INPUTS_HOST}" 587 | grep -q 'STARTTLS'

      - name: Verify SMTPS (465)
        id: smtps
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          nc -zv "${INPUTS_HOST}" 465

      - name: Verify IMAPS capability (993)
        id: imaps
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          echo "QUIT" | openssl s_client \
            -quiet \
            -connect "${INPUTS_HOST}:993" \
            2>/dev/null \
            | grep -q 'OK'

      - name: Verify Mail-in-a-Box web UI
        id: web_ui
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            "https://${INPUTS_HOST}/" \
            >/dev/null

      - name: Verify DNS MX record
        id: dns_mx
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          domain="${INPUTS_HOST#*.}"
          dig +short MX "$domain" | grep -q "${INPUTS_HOST}"

      - name: Verify DNS SPF record
        id: dns_spf
        continue-on-error: true
        env:
          INPUTS_HOST: ${{ inputs.host }}
        run: |
          domain="${INPUTS_HOST#*.}"
          dig +short TXT "$domain" | grep -q 'v=spf1'

      - name: Generate smoke-test summary
        if: always()
        env:
          SMTP_RESULT: >-
            ${{ steps.smtp.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          SUBMISSION_RESULT: >-
            ${{ steps.submission.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          SMTPS_RESULT: >-
            ${{ steps.smtps.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          IMAPS_RESULT: >-
            ${{ steps.imaps.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          WEB_UI_RESULT: >-
            ${{ steps.web_ui.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          DNS_MX_RESULT: >-
            ${{ steps.dns_mx.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          DNS_SPF_RESULT: >-
            ${{ steps.dns_spf.outcome == 'success'
                && '✅ PASS'
                || '❌ FAIL' }}

          INPUTS_HOST: ${{ inputs.host }}

        run: |
          {
            echo "# Smoke Test Summary"
            echo
            echo "Host: \`${INPUTS_HOST}\`"
            echo
            echo "| Test | Result |"
            echo "|------|--------|"
            echo "| SMTP banner (25) | ${SMTP_RESULT} |"
            echo "| Submission STARTTLS (587) | ${SUBMISSION_RESULT} |"
            echo "| SMTPS (465) | ${SMTPS_RESULT} |"
            echo "| IMAPS capability (993) | ${IMAPS_RESULT} |"
            echo "| Mail-in-a-Box web UI | ${WEB_UI_RESULT} |"
            echo "| DNS MX record | ${DNS_MX_RESULT} |"
            echo "| DNS SPF record | ${DNS_SPF_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any smoke test failed
        if: >-
          steps.smtp.outcome != 'success' ||
          steps.submission.outcome != 'success' ||
          steps.smtps.outcome != 'success' ||
          steps.imaps.outcome != 'success' ||
          steps.web_ui.outcome != 'success' ||
          steps.dns_mx.outcome != 'success' ||
          steps.dns_spf.outcome != 'success'
        run: exit 1
