---
name: 🔥 Preheat Ansible Cache

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ansible-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-cache:
    name: Warm Ansible dependency cache
    runs-on: ubuntu-latest

    steps:
      - name: Collect Workflow Telemetry
        # yamllint disable-line rule:line-length
        uses: tsviz/actions-runner-telemetry@0fbec1ca185a193c94e4540e244110fdee912693 # v1.7.3
        with:
          enabled: ${{ vars.RUNNER_TELEMETRY_ENABLED || 'true' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Ansible cache
        id: restore
        uses: ./.github/actions/restore-ansible-cache

      - name: Save Ansible cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.ansible/collections
            /home/runner/.ansible/roles
          key: ${{ steps.restore.outputs.cache-primary-key }}
