---
name: 📊 Workflow Metrics

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "33 3 * * *" # Runs daily at 03:33 UTC
  workflow_dispatch:

concurrency:
  group: ${{ format(
    '{0}-{1}',
    github.workflow,
    github.event_name == 'pull_request' && github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  actions: read
  issues: write

jobs:
  metrics:
    runs-on: ubuntu-26.04

    steps:
      # yamllint disable-line rule:line-length
      - uses: yykamei/github-workflows-metrics@d44ecf5b3f1eabe5c2d750c484bb476033678c96 # v0.4.6
        with:
          only: pipeline.yml
          status: success
          aggregate: median
