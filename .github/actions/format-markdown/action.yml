---
name: Format Markdown
description: Format Markdown files with Prettier

inputs:
  files:
    description: "Glob pattern of Markdown files to format"
    required: true

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Format Markdown
      run: npx --yes prettier --write "${INPUTS_FILES}"
      shell: bash
      env:
        INPUTS_FILES: ${{ inputs.files }}
