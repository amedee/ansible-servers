---
name: Setup Python and Install Dependencies
description: Setup Python, restore cached virtualenv, and install dependencies if needed

inputs:
  python-version:
    description: "Python version to use"
    default: "3.x"
  requirements-file:
    description: "Path to the requirements file"
    default: "requirements.txt"

runs:
  using: "composite"
  steps:
    - name: 🛠️ Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: ♻️ Restore virtualenv cache
      id: venv-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: >
          venv-${{ runner.os }}-${{ inputs.python-version }}-${{
          hashFiles(inputs.requirements-file) }}

    - name: Check venv
      id: check-venv
      shell: bash
      run: |
        if .venv/bin/python --version >/dev/null 2>&1; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 📦 Create virtualenv and install dependencies
      if: steps.venv-cache.outputs.cache-hit != 'true' || steps.check-venv.outputs.valid != 'true'
      shell: bash
      env:
        INPUTS_REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: |
        rm -rf .venv

        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r "${INPUTS_REQUIREMENTS_FILE}"

    - name: Add virtualenv to PATH
      shell: bash
      run: | # zizmor: ignore[github-env] Safe: adds a workflow-created virtualenv to PATH
        echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
